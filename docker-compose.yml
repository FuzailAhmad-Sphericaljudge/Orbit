services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    environment:
      POSTGRES_DB: orbit
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit_local_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build: ./api
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://orbit:orbit_local_only@db:5432/orbit
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      AUTO_CREATE_SCHEMA: "false"
      # Agora agent sessions are in-process; keep the local command API sticky to one worker.
      WEB_CONCURRENCY: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  worker:
    build: ./api
    command: ["python", "-m", "app.worker"]
    env_file:
      - ./api/.env
    environment:
      DATABASE_URL: postgresql+psycopg://orbit:orbit_local_only@db:5432/orbit
      REDIS_URL: redis://redis:6379/0
      REDIS_REQUIRED: "true"
      AUTO_CREATE_SCHEMA: "false"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
  web:
    build:
      context: ./web
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:8080"
    depends_on:
      - api
volumes:
  postgres-data:
  redis-data:
