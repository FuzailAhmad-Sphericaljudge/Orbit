[project]
name = "orbit-incident-engine"
version = "0.6.0"
description = "Real-time incident state and command API for ORBIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.5,<3.0",
  "agora-agents",
  "httpx>=0.27,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "prometheus-client>=0.21,<1.0",
  "pgvector>=0.4,<1.0",
  "alembic>=1.16,<2.0",
  "redis[hiredis]>=6.0,<7.0",
  "cryptography>=45,<47",
]

[tool.uv]
package = false
