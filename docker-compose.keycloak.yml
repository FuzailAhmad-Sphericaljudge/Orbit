services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-orbit-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD before starting Keycloak}
    ports: ["8081:8080"]
    volumes:
      - ./keycloak/realm:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data

volumes:
  keycloak-data:
